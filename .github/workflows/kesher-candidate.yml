name: בדיקת APK לחיבור קשר
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: kesher-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: APK לבדיקת החיבור לקשר
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/kesher-sync-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ה-SDK כבר מותקן על הראנר של GitHub.
      # לא משתמשים ב-android-actions/setup-android — הוא מנסה להתקין
      # חבילה בשם 'tools' שגוגל הוציאה משימוש, ונכשל.
      - name: אימות ה-Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools" >/dev/null && echo "✓ SDK זמין"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          echo "✓ רישיונות אושרו"

      - name: התקנת חבילות
        run: npm ci

      # המנוע לא שונה בחיבור הזה. בדיקת יום הטיסה נכשלת גם ב-main הנוכחי.
      # משאירים את הכשל גלוי ובונים APK מועמד לבדיקת החיבור בלבד.
      - name: בדיקת מנוע היום (כולל כשל קיים ביום הטיסה)
        continue-on-error: true
        run: npm run check

      - name: בדיקות חוזה הסנכרון וניתוק
        run: node scripts/check-kesher.js

      - name: יצירת תיקיית android
        run: npx expo prebuild --platform android --no-install --clean

      - name: שחזור מפתח החתימה
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "✗ חסר הסוד ANDROID_KEYSTORE_BASE64 — ראה BUILD.md"
            exit 1
          fi

          # מנקה רווחים ותווי שורה של Windows שנכנסים דרך הלוח —
          # base64 של לינוקס נופל על \r
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > android/app/release.keystore 2>/dev/null

          SIZE=$(stat -c%s android/app/release.keystore 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 500 ]; then
            echo "✗ הפענוח נכשל — התקבלו $SIZE בייטים בלבד"
            echo "  אורך הסוד: ${#KEYSTORE_B64} תווים"
            echo "  ודא ש-ANDROID_KEYSTORE_BASE64 מכיל את פלט ToBase64String המלא."
            exit 1
          fi

          # קובץ JKS/PKCS12 תקין מתחיל ב-FEEDFEED או ב-3082
          HEAD=$(head -c 4 android/app/release.keystore | od -An -tx1 | tr -d ' \n')
          case "$HEAD" in
            feedfeed*|3082*) echo "✓ המפתח שוחזר ($SIZE בייטים)" ;;
            *) echo "✗ הקובץ אינו keystore תקין (מתחיל ב-$HEAD)"; exit 1 ;;
          esac

      - name: הגדרת סיסמאות החתימה
        run: |
          {
            echo ""
            echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
            echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties

      # רק לטלפון (arm64) — בנייה מהירה פי כמה מאשר לכל סוגי המעבדים
      - name: הגבלה למעבד של הטלפון
        run: |
          sed -i '/^reactNativeArchitectures=/d' android/gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties

      - name: חיבור המפתח לבנייה
        env:
          BUILD_NUMBER: '23'
        run: node scripts/sign-android.js

      - name: בנייה
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: שינוי שם הקובץ
        id: name
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          OUT="seder-hayom-kesher-candidate.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> $GITHUB_OUTPUT
          echo "גודל: $(du -h "$OUT" | cut -f1)"

      - name: העלאת ה-APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
          retention-days: 60

