name: בניית APK

# כל דחיפה ל-main בונה APK חדש ומפרסמת אותו ב-Releases.
# אפשר גם ידנית: Actions ← "בניית APK" ← Run workflow.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40

    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ה-SDK כבר מותקן על הראנר של GitHub.
      # לא משתמשים ב-android-actions/setup-android — הוא מנסה להתקין
      # חבילה בשם 'tools' שגוגל הוציאה משימוש, ונכשל.
      - name: אימות ה-Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools" >/dev/null && echo "✓ SDK זמין"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          echo "✓ רישיונות אושרו"

      - name: התקנת חבילות
        run: npm ci

      - name: בדיקת מנוע היום
        run: node scripts/check-engine.js

      - name: יצירת תיקיית android
        run: npx expo prebuild --platform android --no-install --clean

      - name: שחזור מפתח החתימה
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "✗ חסר הסוד ANDROID_KEYSTORE_BASE64 — ראה BUILD.md"
            exit 1
          fi

          # מנקה רווחים ותווי שורה של Windows שנכנסים דרך הלוח —
          # base64 של לינוקס נופל על \r
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > android/app/release.keystore 2>/dev/null

          SIZE=$(stat -c%s android/app/release.keystore 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 500 ]; then
            echo "✗ הפענוח נכשל — התקבלו $SIZE בייטים בלבד"
            echo "  אורך הסוד: ${#KEYSTORE_B64} תווים"
            echo "  ודא ש-ANDROID_KEYSTORE_BASE64 מכיל את פלט ToBase64String המלא."
            exit 1
          fi

          # קובץ JKS/PKCS12 תקין מתחיל ב-FEEDFEED או ב-3082
          HEAD=$(head -c 4 android/app/release.keystore | od -An -tx1 | tr -d ' \n')
          case "$HEAD" in
            feedfeed*|3082*) echo "✓ המפתח שוחזר ($SIZE בייטים)" ;;
            *) echo "✗ הקובץ אינו keystore תקין (מתחיל ב-$HEAD)"; exit 1 ;;
          esac

      - name: הגדרת סיסמאות החתימה
        run: |
          {
            echo ""
            echo "MYAPP_RELEASE_STORE_FILE=release.keystore"
            echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties

      - name: חיבור המפתח לבנייה
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/sign-android.js

      - name: בנייה
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: שינוי שם הקובץ
        id: name
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          OUT="seder-hayom-$(date +%Y%m%d)-build${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> $GITHUB_OUTPUT
          echo "גודל: $(du -h "$OUT" | cut -f1)"

      - name: העלאת ה-APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
          retention-days: 60

      # הקובץ גם נשמר כ-Release קבוע, כדי שיהיה קישור ישיר להורדה בטלפון
      - name: פרסום כ-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: בנייה ${{ github.run_number }}
          body: |
            נבנה מתוך `${{ github.sha }}`
            להורדה בטלפון — לחץ על קובץ ה-APK למטה.
          make_latest: true
          files: ${{ steps.name.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
